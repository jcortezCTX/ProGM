services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: opshub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: opshub_dev
      POSTGRES_DB: opshub
    ports:
      - "5432:5432"
    volumes:
      - opshub_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opshub -d opshub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  opshub_pgdata:
